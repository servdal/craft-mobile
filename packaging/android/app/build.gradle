plugins { id 'com.android.application' }
def craftRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def keyFile = new File(System.getenv('CRAFT_KEY_PROPERTIES') ?: new File(craftRoot, 'key.properties').path)
def signingValues = new Properties()
if (!keyFile.isFile()) throw new GradleException('Local key.properties is required for a signed release')
keyFile.withInputStream { signingValues.load(it) }
def storePath = signingValues.getProperty('storeFile')
if (!storePath) throw new GradleException('storeFile is missing from the local signing properties')
def store = new File(storePath)
if (!store.isAbsolute()) store = new File(keyFile.parentFile, storePath)
if (!store.isFile()) {
    def localStore = new File(keyFile.parentFile, new File(storePath).name)
    if (localStore.isFile()) store = localStore
}
if (!store.isFile()) throw new GradleException('The configured local release keystore was not found')
android {
    namespace 'com.duidev.craftmobile'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.duidev.craftmobile'
        minSdk 29
        targetSdk 36
        versionCode 7
        versionName '0.1.5'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile store
            storePassword signingValues.getProperty('storePassword')
            keyAlias signingValues.getProperty('keyAlias')
            keyPassword signingValues.getProperty('keyPassword')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def suppliedRules = new File(craftRoot, 'proguard-rules.pro')
            if (suppliedRules.isFile()) proguardFiles suppliedRules
        }
    }
    flavorDimensions += 'editor'
    productFlavors {
        photocraft { dimension 'editor'; applicationIdSuffix '.photocraft' }
        vectorcraft { dimension 'editor'; applicationIdSuffix '.vectorcraft' }
        pdfcraft { dimension 'editor'; applicationIdSuffix '.pdfcraft' }
        wordcraft { dimension 'editor'; applicationIdSuffix '.wordcraft' }
        gridcraft { dimension 'editor'; applicationIdSuffix '.gridcraft' }
        deckcraft { dimension 'editor'; applicationIdSuffix '.deckcraft' }
        cadcraft { dimension 'editor'; applicationIdSuffix '.cadcraft' }
        filmcraft { dimension 'editor'; applicationIdSuffix '.filmcraft' }
        effectcraft { dimension 'editor'; applicationIdSuffix '.effectcraft' }
        lightcraft { dimension 'editor'; applicationIdSuffix '.lightcraft' }
    }
    packaging { jniLibs { useLegacyPackaging false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
