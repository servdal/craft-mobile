[package]
name = "pdfcraft-android"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[lib]
name = "pdfcraft_android"
crate-type = ["cdylib"]
[dependencies]
pdfcraft-ui-egui = { path = "../../pdfcraft/crates/ui-egui", version = "0.9.0" }
craft-mobile-shell = { path = "../../mobile-shell" }

[patch.crates-io]
hayro-interpret = { path = "../../pdfcraft/vendor/hayro-interpret" }
hayro = { path = "../../pdfcraft/vendor/hayro" }
hayro-syntax = { path = "../../pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../../pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "../../pdfcraft/vendor/lopdf" }
winit = { path = "../../pdfcraft/vendor/winit" }
egui-wgpu = { path = "../../pdfcraft/vendor/egui-wgpu" }
vello_common = { path = "../../pdfcraft/vendor/vello_common" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
panic = "unwind"
