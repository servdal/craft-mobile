[package]
name = "cadcraft-android"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[lib]
name = "cadcraft_android"
crate-type = ["cdylib"]
[dependencies]
cadcraft-io = { path = "../../cadcraft/crates/io" }
cadcraft-engine = { path = "../../cadcraft/crates/engine" }
cadcraft-ui-egui = { path = "../../cadcraft/crates/ui-egui" }
craft-mobile-shell = { path = "../../mobile-shell" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
panic = "unwind"
