[package]
name = "gridcraft-android"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[lib]
name = "gridcraft_android"
crate-type = ["cdylib"]
[dependencies]
gridcraft-engine = { path = "../../gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../../gridcraft/crates/ui-egui" }
craft-mobile-shell = { path = "../../mobile-shell" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
panic = "unwind"
