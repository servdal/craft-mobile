[package]
name = "photocraft-android"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[lib]
name = "photocraft_android"
crate-type = ["cdylib"]
[dependencies]
photocraft-engine = { path = "../../photocraft/crates/engine" }
photocraft-ui-egui = { path = "../../photocraft/crates/ui-egui" }
photocraft-io = { path = "../../photocraft/crates/io" }
craft-mobile-shell = { path = "../../mobile-shell" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
panic = "unwind"
