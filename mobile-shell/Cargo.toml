[package]
name = "craft-mobile-shell"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
egui = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
serde_json = "1"
log = "0.4"
craft-mobile-files = { path = "../mobile-files" }
[build-dependencies]
cc = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["game-activity"] }
eframe = { version = "=0.36.2", default-features = false, features = ["android-game-activity"] }
