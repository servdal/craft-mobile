[package]
name = "craft-mobile-shell-v37"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
mobile-ui = { package = "craft-mobile-ui-v37", path = "../mobile-ui-v37" }
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
serde_json = "1"
log = "0.4"
craft-mobile-files = { package = "craft-mobile-files-v37", path = "../mobile-files-v37" }
[build-dependencies]
cc = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["game-activity"] }
eframe = { version = "=0.37.0", default-features = false, features = ["android-game-activity"] }
